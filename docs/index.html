  <style>
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
    /* Boot screen while Flutter starts — intentionally unbranded */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; transition: opacity .5s; z-index: 10; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot i { width: 10px; height: 10px; border-radius: 50%; background: #0b5cff; animation: b 1.1s ease-in-out infinite; box-shadow: 0 0 0 0 rgba(11,92,255,.35); }
    @keyframes b { 50% { transform: scale(1.5); box-shadow: 0 0 0 14px rgba(11,92,255,0); } }
    flt-glass-pane, flutter-view { background: transparent; }
  </style>
  <script>
    /* Phones and tablets get a lighter build of every effect (same look, less work per frame). */
    window.sonotLite = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700 || (navigator.hardwareConcurrency || 8) <= 4;
    /* three.js loads as a module; Flutter may ask for a scene before it's ready, so queue. */
    (function () {
      var queue = [], ids = 0, real = {};
      function flush() {
        var impl = window.sonot3dImpl;
        queue.splice(0).forEach(function (q) {
          if (q.op === 'mount') real[q.id] = impl.mount(q.el, q.kind);
          else if (q.op === 'set' && real[q.id]) impl.setProgress(real[q.id], q.p);
          else if (q.op === 'dispose' && real[q.id]) { impl.dispose(real[q.id]); delete real[q.id]; }
        });
      }
      window.addEventListener('sonot3d-ready', flush);
      function run(q) { queue.push(q); if (window.sonot3dImpl) flush(); }
      window.sonot3d = {
        mount: function (el, kind) { var id = ++ids; run({ op: 'mount', id: id, el: el, kind: kind }); return id; },
        setProgress: function (id, p) { if (window.sonot3dImpl && real[id]) window.sonot3dImpl.setProgress(real[id], p); else run({ op: 'set', id: id, p: p }); },
        dispose: function (id) { run({ op: 'dispose', id: id }); }
      };
    })();
  </script>
  <script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script>
  <script src="js/audio.js"></script>
  <script type="module" src="js/sonot3d.js"></script>

<body>
  <div id="boot" aria-hidden="true"><i></i></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot'); b.classList.add('gone'); setTimeout(function () { b.remove(); }, 600);
    });
  </script>
